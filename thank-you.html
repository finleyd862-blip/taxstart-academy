<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Application Received | Tax Star Academy</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #172033;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,.1);
        }

        .check {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #21c997;
            color: #101828;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 40px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #667085;
            font-size: 17px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            border-radius: 8px;
            background: #101828;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #21c997;
            color: #101828;
        }

    </style>

</head>

<body>

<div class="page">

    <div class="card">

        <div class="check">
            ✓
        </div>

        <h1>Application Received!</h1>

        <p>
            Thank you for applying to Tax Star Academy.
        </p>

        <p>
            Your employment application has been submitted successfully.
            Our team will review your information and contact you if your
            qualifications match an available opportunity.
        </p>

        <a
            class="button"
            href="index.html"
        >
            Return to Tax Star Academy
        </a>

    </div>

</div>

</body>

</html>
